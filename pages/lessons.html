<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài học - MathUp VN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/polish.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="main-padded">
    <div class="container">
      <div class="page-header reveal-scale">
        <span class="page-header-deco" aria-hidden="true">π</span>
        <span class="section-num">Bài học</span>
        <h1>Danh mục <em>bài giảng</em></h1>
        <p>Lọc theo chủ đề, chọn bài phù hợp — mỗi bài có video, tài liệu và câu hỏi ôn tập.</p>
      </div>

      <div class="filter-tabs-wrap">
        <div class="filter-tabs" id="filterTabs"></div>
        <span class="lesson-count" id="lessonCount">4 bài học</span>
      </div>
      <div class="grid-3" id="lessonsGrid"></div>
      <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-state-icon">📚</div>
        <p>Không có bài học nào trong chủ đề này.</p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/lessons.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Làm bài thi - MathUp VN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/polish.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body class="exam-page">
  <div id="site-header"></div>

  <div class="exam-bar" id="examBar" style="display: none;">
    <div class="container exam-bar-inner">
      <div class="exam-bar-start">
        <a href="exams.html" class="exam-bar-back" aria-label="Quay lại danh sách đề thi">
          <span class="exam-bar-back-icon" aria-hidden="true">←</span>
          <span class="exam-bar-back-text">Thoát</span>
        </a>
        <div class="exam-bar-divider" aria-hidden="true"></div>
        <div class="exam-bar-title-wrap">
          <span class="exam-bar-label">Phòng thi</span>
          <span class="exam-bar-title" id="examBarTitle"></span>
        </div>
      </div>

      <div class="exam-bar-center">
        <div class="progress-wrapper">
          <div class="progress-label">
            <span id="progressText">Câu 1/10</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
          </div>
        </div>
      </div>

      <div class="exam-bar-end">
        <div class="timer" id="examTimer">
          <span class="timer-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8.5" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v4l2.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <span id="timerDisplay">00:00</span>
        </div>
        <button class="btn btn-danger btn-sm exam-submit-btn" id="submitExamBtn">
          <span aria-hidden="true">✓</span> Nộp bài
        </button>
      </div>
    </div>
  </div>

  <main class="exam-main">
    <div class="container" id="examContainer"></div>
  </main>

  <div id="site-footer"></div>

  <div class="modal-overlay" id="submitModal">
    <div class="modal exam-modal">
      <div class="exam-modal-icon" aria-hidden="true">📋</div>
      <h3>Xác nhận nộp bài</h3>
      <p id="submitModalText">Bạn chắc chắn muốn nộp bài thi? Hành động này không thể hoàn tác.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelSubmitBtn">Tiếp tục làm</button>
        <button class="btn btn-primary" id="confirmSubmitBtn">Nộp bài ngay</button>
      </div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/exam.js"></script>
</body>
</html>

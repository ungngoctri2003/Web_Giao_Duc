<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Làm bài thi - MathUp VN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/polish.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="exam-bar" id="examBar" style="display: none;">
    <div class="container exam-bar-inner">
      <span class="exam-bar-label">Phòng thi</span>
      <div class="timer" id="examTimer">
        <span>⏱</span>
        <span id="timerDisplay">00:00</span>
      </div>
      <div class="progress-wrapper">
        <div class="progress-label">
          <span id="progressText">Câu 1/10</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>
      </div>
      <button class="btn btn-danger btn-sm" id="submitExamBtn">Nộp bài</button>
    </div>
  </div>

  <main class="main-padded">
    <div class="container" id="examContainer"></div>
  </main>

  <div id="site-footer"></div>

  <!-- Submit modal -->
  <div class="modal-overlay" id="submitModal">
    <div class="modal">
      <h3>Xác nhận nộp bài</h3>
      <p id="submitModalText">Bạn chắc chắn muốn nộp bài thi? Hành động này không thể hoàn tác.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelSubmitBtn">Hủy</button>
        <button class="btn btn-primary" id="confirmSubmitBtn">Nộp bài</button>
      </div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/exam.js"></script>
</body>
</html>
